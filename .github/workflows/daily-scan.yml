name: Daily watchlist scan

on:
  schedule:
    # GitHub cron 使用 UTC，且可能延迟 5–30 分钟
    - cron: "0 9 * * 1-5"     # 北京 17:00：A股/港股/韩股/日股/澳股 收盘后
    - cron: "30 21 * * 1-5"   # 北京次日 05:30：美股/英股/德股 收盘后（夏令时/冬令时都已收盘）
  workflow_dispatch:
    inputs:
      session:
        description: "asia / us_eu / all"
        default: us_eu
        type: choice
        options: [us_eu, asia, all]
      always_send:
        description: "没有信号也发送邮件（测试邮件配置用）"
        type: boolean
        default: false
      any_date:
        description: "不检查K线是否为今天（周末/假日补跑测试用）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-bot.txt

      - run: pip install -r requirements-bot.txt

      - name: Pick session
        id: s
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "session=${{ inputs.session }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1-5" ]; then
            echo "session=asia" >> "$GITHUB_OUTPUT"
          else
            echo "session=us_eu" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan & email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          ARGS="--session ${{ steps.s.outputs.session }} --preview latest/${{ steps.s.outputs.session }}_email.html"
          [ "${{ inputs.always_send }}" = "true" ] && ARGS="$ARGS --always"
          [ "${{ inputs.any_date }}" = "true" ] && ARGS="$ARGS --any-date"
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ]; then ARGS="$ARGS --email"; else echo "::warning::未配置 SMTP_USER/SMTP_PASS，跳过发邮件"; fi
          python -m ss_scanner daily $ARGS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest
          if [ -d history ]; then git add history; fi
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "scan: ${{ steps.s.outputs.session }} $(date -u +%F)"
          git pull --rebase --autostash && git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ steps.s.outputs.session }}-${{ github.run_id }}
          path: latest/
          retention-days: 14
